name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test fixture config
        # Importing rotator needs a confidential.json with at least one
        # account token. The tests override everything else. CI goes through
        # the same steps a real install does: init, two accounts (the token
        # piped on stdin), one device.
        run: |
          ./setup.py
          echo "sk-ant-oat01-ci-dummy-token" | ./setup.py add-account acct-1
          echo "sk-ant-oat01-ci-dummy-token" | ./setup.py add-account acct-2
          ./setup.py add-device ci-runner

      - name: Run test suite
        run: python tests/run_all.py
